<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liste de Noël de Lucas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --bg:   #080f1c;
      --sf:   #0f1f38;
      --sf2:  #0d1a30;
      --fg:   #eee8d8;
      --fg2:  #6a86a8;
      --gold: #d4a820;
      --gd:   rgba(212,168,32,.12);
      --red:  #c0341c;
      --redh: #d84020;
      --grn:  #2a7a3a;
      --bdr:  rgba(212,168,32,.15);
      --bdr2: rgba(255,255,255,.07);
      --sh:   0 8px 32px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    html,body{min-height:100%}
    body{
      background:var(--bg);color:var(--fg);
      font-family:'DM Sans',system-ui,sans-serif;
      overflow-x:hidden;
    }

    /* ---- Particles ---- */
    #particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .ptcl{
      position:absolute;top:-2em;
      animation:fall linear infinite;user-select:none;
      line-height:1
    }
    @keyframes fall{to{transform:translateY(110vh) rotate(20deg)}}
    @media(prefers-reduced-motion:reduce){.ptcl{display:none}}

    /* ---- Page shell ---- */
    .page{
      position:relative;z-index:1;max-width:1240px;margin:0 auto;
      padding-left:max(20px,env(safe-area-inset-left,0px));
      padding-right:max(20px,env(safe-area-inset-right,0px));
    }

    /* ---- Header ---- */
    header{padding:3.5rem 0 2.2rem}
    .header-inner{
      display:flex;flex-direction:column;align-items:flex-start;gap:.5rem
    }
    .eyebrow{
      font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;
      text-transform:uppercase;letter-spacing:.18em;color:var(--gold);
      opacity:.8
    }
    h1{
      font-family:'Syne',sans-serif;
      font-size:clamp(2rem,6vw,3.8rem);font-weight:800;
      color:var(--fg);letter-spacing:-.03em;line-height:1.05;
      text-wrap:balance
    }
    h1 em{font-style:normal;color:var(--gold)}
    .sub{
      color:var(--fg2);font-size:.95rem;margin-top:.35rem;
      max-width:38ch;line-height:1.6
    }
    .badge{
      margin-top:.9rem;
      display:inline-flex;align-items:center;gap:.45rem;
      background:var(--gd);border:1px solid var(--bdr);
      border-radius:6px;padding:.4rem .85rem;
      font-size:.78rem;color:var(--gold);font-weight:600;letter-spacing:.02em
    }

    /* ---- Bento Grid ---- */
    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1rem;padding-bottom:5rem
    }
    .card{
      background:var(--sf);border:1px solid var(--bdr2);
      border-radius:18px;padding:1.3rem;box-shadow:var(--sh);
      position:relative;overflow:hidden;
      transition:transform .22s,border-color .22s,box-shadow .22s;
      display:flex;flex-direction:column
    }
    .card.wide{grid-column:span 2}
    .card.wide .prod-img{height:240px}
    .card:not(.res):hover{
      transform:translateY(-4px);
      border-color:rgba(212,168,32,.4);
      box-shadow:0 20px 56px rgba(0,0,0,.6),0 0 24px rgba(212,168,32,.06)
    }
    .card.res{opacity:.44;filter:grayscale(60%)}

    /* Product image */
    .prod-img{
      width:100%;height:200px;object-fit:contain;
      border-radius:12px;margin-bottom:1rem;
      background:rgba(255,255,255,.05);display:block;
      padding:8px;flex-shrink:0
    }
    .cat{
      font-size:.62rem;text-transform:uppercase;letter-spacing:.15em;
      color:var(--gold);font-weight:600;margin-bottom:.3rem
    }
    .name{
      font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;
      line-height:1.25;margin-bottom:.3rem;text-wrap:balance;letter-spacing:-.01em
    }
    .dtl{font-size:.78rem;color:var(--fg2);margin-bottom:.5rem;min-height:1.1em}
    .price{
      font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;
      color:var(--gold);font-variant-numeric:tabular-nums;
      margin-bottom:.8rem;margin-top:auto;letter-spacing:-.02em
    }
    .lnk{
      display:inline-flex;align-items:center;gap:.3rem;
      color:var(--fg2);text-decoration:none;font-size:.76rem;
      margin-bottom:.8rem;transition:color .15s
    }
    .lnk:hover{color:var(--gold)}
    .lnk-arrow{font-size:.65rem;opacity:.6}
    .btn-r{
      width:100%;padding:.6rem 1rem;background:var(--red);color:#fff;
      border:none;border-radius:9px;font-size:.84rem;font-weight:600;
      cursor:pointer;transition:background .15s,transform .1s;
      font-family:'DM Sans',inherit;letter-spacing:.01em
    }
    .btn-r:hover{background:var(--redh)}
    .btn-r:active{transform:scale(.97)}
    .rby{
      display:flex;align-items:center;gap:.4rem;font-size:.8rem;
      color:var(--fg2);padding:.5rem .7rem;
      background:rgba(255,255,255,.04);border-radius:8px
    }
    .rby strong{color:var(--fg)}
    .ribbon{
      position:absolute;top:16px;right:-28px;
      background:var(--red);color:#fff;
      font-size:.6rem;font-weight:700;padding:4px 42px;
      transform:rotate(45deg);text-transform:uppercase;
      letter-spacing:.1em;box-shadow:0 2px 8px rgba(0,0,0,.3)
    }

    /* Loading */
    .ld{text-align:center;padding:5rem 1rem;color:var(--fg2);font-size:.95rem}
    .spin{display:inline-block;width:28px;height:28px;
      border:2px solid var(--bdr2);border-top-color:var(--gold);
      border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Modal */
    .ov{
      position:fixed;inset:0;background:rgba(0,0,0,.78);
      display:flex;align-items:center;justify-content:center;z-index:100;
      padding:max(16px,env(safe-area-inset-left,0px));
      backdrop-filter:blur(8px)
    }
    .modal{
      background:#111f38;border:1px solid rgba(212,168,32,.25);
      border-radius:20px;padding:2rem;width:min(400px,100%);
      box-shadow:0 32px 96px rgba(0,0,0,.7);animation:min .2s ease
    }
    @keyframes min{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
    .modal h2{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;
      color:var(--gold);margin-bottom:.35rem;text-wrap:balance;letter-spacing:-.01em}
    .modal p{font-size:.86rem;color:var(--fg2);margin-bottom:1.3rem;line-height:1.55}
    input[type=text]{
      width:100%;padding:.72rem 1rem;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
      border-radius:10px;color:var(--fg);font-size:.96rem;
      font-family:'DM Sans',inherit;outline:none;
      transition:border-color .15s;margin-bottom:1.2rem
    }
    input[type=text]:focus{border-color:var(--gold)}
    input[type=text].err{border-color:var(--red)}
    input[type=text]::placeholder{color:var(--fg2)}
    .mbtns{display:flex;gap:.7rem}
    .bcl{
      flex:1;padding:.62rem;background:transparent;color:var(--fg2);
      border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;
      font-size:.84rem;font-family:'DM Sans',inherit;transition:background .15s
    }
    .bcl:hover{background:rgba(255,255,255,.05)}
    .bok{
      flex:2;padding:.62rem;background:var(--red);color:#fff;border:none;
      border-radius:10px;cursor:pointer;font-size:.84rem;font-weight:600;
      font-family:'DM Sans',inherit;transition:background .15s
    }
    .bok:hover:not(:disabled){background:var(--redh)}
    .bok:disabled{opacity:.5;cursor:not-allowed}

    /* Toast */
    .toast{
      position:fixed;
      bottom:max(1.5rem,env(safe-area-inset-bottom,1.5rem));
      left:50%;transform:translateX(-50%);
      padding:.75rem 1.3rem;border-radius:10px;font-size:.88rem;font-weight:600;
      z-index:200;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.45);
      animation:ta 3.2s forwards;pointer-events:none;
      font-family:'DM Sans',inherit
    }
    .tok{background:var(--grn);color:#fff}
    .terr{background:var(--red);color:#fff}
    @keyframes ta{
      0%{opacity:0;transform:translateX(-50%) translateY(8px)}
      12%{opacity:1;transform:translateX(-50%) translateY(0)}
      78%{opacity:1;transform:translateX(-50%) translateY(0)}
      100%{opacity:0;transform:translateX(-50%) translateY(8px)}
    }

    /* Responsive */
    @media(max-width:900px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .card.wide{grid-column:span 1}
      .card.wide .prod-img{height:200px}
    }
    @media(max-width:540px){
      .grid{grid-template-columns:1fr 1fr;gap:.75rem}
      .card{padding:.9rem}
      .prod-img{height:150px}
      .price{font-size:1.1rem}
      .name{font-size:.9rem}
      h1{font-size:2rem}
    }
    @media(max-width:360px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="particles" aria-hidden="true"></div>

<div class="page">
  <header>
    <div class="header-inner">
      <span class="eyebrow">Noel 2024</span>
      <h1>Liste de <em>Lucas</em></h1>
      <p class="sub">Réservez un cadeau pour qu'il ne soit pas offert deux fois.</p>
      <div class="badge" id="badge" hidden>
        <span id="badge-txt"></span>
      </div>
    </div>
  </header>
  <div id="app">
    <div class="ld"><div class="spin"></div><div>Chargement...</div></div>
  </div>
</div>

<div class="ov" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <h2 id="modal-h"></h2>
    <p>Entrez votre prénom pour réserver ce cadeau. Les autres verront qu'il est déjà pris.</p>
    <input type="text" id="name-inp" placeholder="Votre prénom..." maxlength="30" autocomplete="given-name">
    <div class="mbtns">
      <button class="bcl" id="btn-cancel">Annuler</button>
      <button class="bok" id="btn-ok">Réserver</button>
    </div>
  </div>
</div>

<script>
const GIFTS = [
  {id:'knit-808',               name:'Knit 808 Vision',           img:'https://808.vision/cdn/shop/files/13565E2C-5E07-4CD1-9971-A64746ABB393.png?v=1772642411',                                                       price:'80€',       shop:'808 Vision',    url:'https://808.vision/products/knit-mesh-black',                                                       cat:'Accessoire',  dtl:'Taille M',  wide:true},
  {id:'pull-rose-scuffers',     name:'Pull Rose Scuffers',         img:'https://scuffers.com/cdn/shop/files/EmptyName6_75bb776a-fad5-4f7c-871e-b087d2ac3755.jpg?height=600&v=1786968853',                               price:'89€',       shop:'Scuffers',       url:'https://scuffers.com/collections/hoodies/products/original-pink-hoodie',                           cat:'Vêtement',    dtl:'Taille M'},
  {id:'pull-mariniere-scuffers',name:'Pull Marinière Scuffers',    img:'https://scuffers.com/cdn/shop/files/ECOM_1.jpg?height=600&v=1788867488',                                                                         price:'89€',       shop:'Scuffers',       url:'https://scuffers.com/collections/hoodies/products/carpet-yellow-hoodie',                           cat:'Vêtement',    dtl:'Taille M'},
  {id:'clavier-logitech',       name:'Clavier Logitech Sans Fil',  img:'https://m.media-amazon.com/images/I/61wuD7T-WLL._AC_SL500_.jpg',                                                                                price:'119,99€',   shop:'Amazon',         url:'https://www.amazon.fr/dp/B0D3HHXB9Y/',                                                              cat:'Tech',         dtl:'',          wide:true},
  {id:'jogging-divinbydivin',   name:'Jogging DivinByDivin',       img:'https://divinbydivin.com/cdn/shop/files/jogg-black_277664a0-caf1-4d7c-886e-ab8cd04d8ae6.jpg?v=1733221089',                                      price:'109,95€',   shop:'Divin By Divin', url:'https://divinbydivin.com/products/black-line-jogger',                                                   cat:'Vêtement',    dtl:'Taille M'},
  {id:'akimbo-lows',            name:'Akimbo Lows',                img:'https://www.vicinityclo.de/cdn/shop/files/Untitled-1_0075_Layer0copy3.jpg?v=1739264338',                                                        price:'134,99€',   shop:'Vicinity',       url:'https://www.vicinityclo.de/products/akimbo-lows-serge-blues',                                           cat:'Chaussures',  dtl:'Taille 43'},
  {id:'pantalon-camo-beige',    name:'Pantalon Camo Beige',        img:'https://static.zara.net/assets/public/a6fe/c4ce/2a224aea8919/e46734810d1e/06917300021-p/06917300021-p.jpg?ts=1786375129205&w=560',               price:'22,99€',    shop:'Zara',           url:'https://www.zara.com/fr/fr/pantalon-coupe-ballon-imprime-abstrait-p06917300.html?v1=550292797',       cat:'Vêtement',    dtl:''},
  {id:'jean-camo-gris',         name:'Jean Camo Gris Beige',       img:'https://static.zara.net/assets/public/2830/b0c9/961b464c9636/a1119684cd6d/02005805806-p/02005805806-p.jpg?ts=1791283248414&w=560',               price:'39,95€',    shop:'Zara',           url:'https://www.zara.com/fr/fr/pantalon-coupe-decontractee-imprime-abstrait-p02005805.html?v1=568076212', cat:'Vêtement',    dtl:''},
]

// Particle animation: Santas + elves falling
;(function(){
  const chars = ['🎅','🎅','🤶','🧝','🧝‍♂️','🦌']
  const s = document.getElementById('particles')
  for(let i=0;i<28;i++){
    const p=document.createElement('span')
    p.className='ptcl';p.textContent=chars[i%chars.length];p.setAttribute('aria-hidden','true')
    const sz = (Math.random()*1.1+0.7).toFixed(2)
    p.style.cssText=`left:${(Math.random()*100).toFixed(1)}vw;font-size:${sz}em;opacity:${(Math.random()*.25+.1).toFixed(2)};animation-duration:${(Math.random()*14+10).toFixed(1)}s;animation-delay:${(Math.random()*22).toFixed(1)}s`
    s.appendChild(p)
  }
})()

let res={}, cur=null
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

function render(){
  const avail=GIFTS.length-Object.values(res).filter(Boolean).length
  document.getElementById('badge-txt').textContent=
    avail===0?'Tous les cadeaux sont réservés':`${avail} cadeau${avail>1?'x':''} disponible${avail>1?'s':''}`
  document.getElementById('badge').hidden=false
  document.getElementById('app').innerHTML=
    `<div class="grid">${GIFTS.map(g=>{
      const r=res[g.id]
      return `<article class="card${r?' res':''}${g.wide?' wide':''}">
        ${r?'<div class="ribbon" aria-hidden="true">Réservé</div>':''}
        ${g.img?`<img class="prod-img" src="${g.img}" alt="${esc(g.name)}" loading="lazy">`:''}
        <div class="cat">${g.cat}</div>
        <div class="name">${g.name}</div>
        <div class="dtl">${g.dtl}</div>
        <div class="price">${g.price}</div>
        <a class="lnk" href="${g.url}" target="_blank" rel="noopener noreferrer">Voir chez ${g.shop} <span class="lnk-arrow">↗</span></a>
        ${r
          ?`<div class="rby">Réservé par <strong>${esc(r.by)}</strong></div>`
          :`<button class="btn-r" onclick="open_('${g.id}')">Je l'offre</button>`
        }
      </article>`
    }).join('')}</div>`
}

async function load(){
  try{const r=await fetch('/api/reservations');res=await r.json()}catch(e){}
  render()
}

function open_(id){
  const g=GIFTS.find(x=>x.id===id);if(!g)return
  cur=g
  document.getElementById('modal-h').textContent=g.name
  document.getElementById('name-inp').value=''
  document.getElementById('name-inp').classList.remove('err')
  document.getElementById('btn-ok').textContent='Réserver'
  document.getElementById('btn-ok').disabled=false
  document.getElementById('modal').hidden=false
  setTimeout(()=>document.getElementById('name-inp').focus(),60)
}
function close_(){document.getElementById('modal').hidden=true;cur=null}

document.getElementById('btn-cancel').onclick=close_
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))close_()})
document.getElementById('name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')doRes();if(e.key==='Escape')close_()})
document.getElementById('btn-ok').onclick=doRes

async function doRes(){
  const name=document.getElementById('name-inp').value.trim()
  if(!name){document.getElementById('name-inp').classList.add('err');document.getElementById('name-inp').focus();return}
  const btn=document.getElementById('btn-ok')
  btn.disabled=true;btn.textContent='Réservation...'
  try{
    const r=await fetch(`/api/gift/${cur.id}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name})
    })
    if(r.ok){
      res[cur.id]={by:name}
      close_();toast(`Merci ${esc(name)} ! Cadeau réservé.`,'tok');render()
    }else if(r.status===409){
      const d=await r.json()
      close_();toast(`Déjà réservé par ${esc(d.by||'quelqu\'un')} !`,'terr')
      load()
    }else{
      toast('Erreur, réessaie.','terr')
      btn.disabled=false;btn.textContent='Réserver'
    }
  }catch(e){
    toast('Erreur de connexion.','terr')
    btn.disabled=false;btn.textContent='Réserver'
  }
}

let tt=null
function toast(msg,cls){
  document.querySelector('.toast')?.remove();clearTimeout(tt)
  const el=document.createElement('div')
  el.className=`toast ${cls}`;el.textContent=msg;el.setAttribute('role','status')
  document.body.appendChild(el)
  tt=setTimeout(()=>el.remove(),3400)
}

load()
setInterval(load,30000)
</script>
</body>
</html>
